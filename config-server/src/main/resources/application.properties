spring.application.name=config-server
server.port=8888

# Backend "native": le os.properties direto da pasta config-repo, sem exigir
# repositório Git. Os dois caminhos cobrem rodar a partir da raiz do projeto
# ou de dentro de config-server/ -- não ha caminho fixo de nenhuma máquina.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo,file:../config-repo

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/