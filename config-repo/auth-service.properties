# Configurações do auth-service, centralizadas no Config Server.
# Este arquivo é lido pelo config-server a partir do repositório
# Git e servido ao auth-service quando ele sobe
# (spring.config.import=configserver:...).

server.port=8084

server.error.include-message=always

jwt.secret=00d23b30-8bd5-4cfa-935c-9305be24d5f7

# Keycloak: configure these values in the environment or config-server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ecommerce}
keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/ecommerce/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:auth-service}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.admin-token-uri=${KEYCLOAK_ADMIN_TOKEN_URI:http://localhost:8080/realms/master/protocol/openid-connect/token}
keycloak.admin-users-uri=${KEYCLOAK_ADMIN_USERS_URI:http://localhost:8080/admin/realms/ecommerce/users}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# H2 em memória
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2, acessível em http://localhost:8084/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Registro no Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
