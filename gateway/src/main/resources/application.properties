# Configuração mínima local: nome da aplicação (usado para buscar
# "gateway.properties" no config-server) e o endereço do
# config-server. O restante das configurações (porta, datasource,
# eureka...) vem do repositório Git via config-server, em
# config-repo/gateway.properties.
spring.application.name=gateway
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
