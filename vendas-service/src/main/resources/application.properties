# Configuração mínima local: nome da aplicação (usado para buscar
# "vendas-service.properties" no config-server) e o endereço do
# config-server. O restante das configurações (porta, datasource,
# eureka...) vem do repositório Git via config-server, em
# config-repo/vendas-service.properties.
spring.application.name=vendas-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
